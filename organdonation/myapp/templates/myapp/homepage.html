<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Organ Donation</title>
    {% load static %}
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('{% static "images/000.jpg" %}') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: "Playfair Display", serif;
            letter-spacing: 2px;
            color: white;
        }
        /* Navbar Styling */
        .navbar {
            background: #111;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .navbar h2 {
            margin: 0;
            font-size: 22px;
            color: white;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s ease-in-out;
        }

        .menu a:hover {
            background: #007BFF;
        }
        .content {
            padding: 80px 20px;
            text-align: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h2>Organ Donation</h2>
    <div class="menu">
        <a href="/homepage">Home</a>
        <a href="/requestorgan">Request</a>
        <a href="/login">Logout</a>
    </div>
</div>

<!-- Page Content -->
<div class="w3-row w3-padding-64 content">
    <h1>Welcome to the Organ Donation Platform</h1>
    <p>Your contribution can save lives. Join us in making a difference.</p>
</div>

</body>
</html>
