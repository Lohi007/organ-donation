<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organ Donation & Sign-In</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            min-height: 100vh;
            background: url('/static/images/fgf.jpg') no-repeat center center/cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .navbar .menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .navbar .menu a:hover {
            background-color: #007BFF;
        }

        .main-container {
            display: flex;
            flex: 1;
            margin-top: 54px;
        }

        .left-section {
            flex: 1;
            padding: 20px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7); /* Dark background for left section */
         }

        .left-section h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .left-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .left-section li {
            margin-bottom: 10px;
            font-size: 18px;
            color: #ffeb3b;
        }

        .right-section {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #36454F;
            margin: 10px 0 5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.3);
            color: #000;
        }

        input::placeholder {
            color: black;
        }

        input:hover, select:hover {
            background: white;
            color: black;
        }

        select {
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid #ccc;
            appearance: none;
        }

        select option {
            background-color: #222;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0437F2;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e6b3a;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .left-section, .right-section {
                width: 100%;
                padding: 10px;
            }
            .container {
                width: 90%;
                margin: 20px auto;
            }
            .navbar .menu a {
                font-size: 14px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="menu">
            <a href="/home">Home</a>
        </div>
    </div>

    <div class="main-container">
        <div class="left-section">
            <h2>Live Updates on Our Organ Donation Initiative</h2>
            <ul id="live-updates">
            </ul>
        </div>

        <div class="right-section">
            <div class="container">
                <form action="{% url 'login' %}" method="POST">
                    {% csrf_token %}
                    <h1>Sign-In</h1>
                    <label for="usertype">User Type</label>
                    <select id="usertype" name="usertype" required>
                        <option value="Recipient">Recipient</option>
                        <option value="Blockchain">Blockchain</option>
                    </select>
                    <label for="first">User Name</label>
                    <input type="text" id="first" name="first" required placeholder="Enter your username" />
                    <label for="pwd">Password</label>
                    <input type="password" id="pwd" name="pwd" required placeholder="Enter your password" />
                    <button type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const updatesList = document.getElementById('live-updates');
        const newUpdates = [
            "New: Organ Donation Camp on 20th July!",
            "Urgent: Blood Drive for Type O+ starting tomorrow.",
            "Success: 3 more lives saved through transplants today!",
            "Volunteer Training Session on 22nd July.",
            "Important: Changes to organ donation process, please check your profile."
        ];

        let updateIndex = 0;
        let displayedUpdates = 0; // Keep track of how many updates are currently displayed

        function addUpdate() {
            if (updateIndex < newUpdates.length) {
                const newUpdateItem = document.createElement('li');
                newUpdateItem.textContent = newUpdates[updateIndex];
                newUpdateItem.style.color = '#ffeb3b';

                if (displayedUpdates < 3) {
                    updatesList.appendChild(newUpdateItem);
                    displayedUpdates++;
                } else {
                    updatesList.removeChild(updatesList.firstChild);
                    updatesList.appendChild(newUpdateItem);
                }
                updateIndex++;
            } else {
                updateIndex = 0;
            }
        }

        setInterval(addUpdate, 5000);
    </script>
</body>
</html>
