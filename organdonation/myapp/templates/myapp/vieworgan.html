<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Data Authentication</title>
    {% load static %}
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        /* General Styling */
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #6a93cb, #a4c7e3);
            color: #333;
            margin: 0;
            padding: 0;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: "Playfair Display", serif;
            letter-spacing: 2px;
        }

        /* Navbar */
        .w3-top {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .w3-bar-item {
            font-size: 18px;
            font-weight: 500;
            padding: 12px 20px;
        }

        .w3-bar-item:hover {
            background: #4c87b5;
            color: white !important;
            border-radius: 5px;
        }

        /* Data Table */
        .data-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 50px 0;
        }

        .data-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 60%;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .data-card h2 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .data-content {
            font-size: 18px;
            color: #333;
            background: #f4f8fb;
            padding: 15px;
            border-radius: 8px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
            word-wrap: break-word;
            line-height: 1.5;
        }

        /* Footer */
        .footer {
            background: black;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="w3-top">
    <div class="w3-bar w3-white w3-padding w3-card" style="letter-spacing:4px;">
        <h2 class="w3-bar-item">Blockchain Based Data Authentication & Analytical Insight</h2>
        <div class="w3-right w3-hide-small">
            <a href="/login" class="w3-bar-item w3-button">Logout</a>
        </div>
    </div>
</div>

<!-- Spacing for Navbar -->
<br><br><br>

<!-- Blockchain Data Section -->
<div class="data-container">
    <div class="data-card">
        <h2>Blockchain Data</h2>
        <div class="data-content">
            <p>{{ data }}</p>
        </div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <p>© 2025 Blockchain Organ Donation. All Rights Reserved.</p>
</div>

</body>
</html>
