<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Registration Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
    * {
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
    }

    body {
        background: url('{% static "images/maybe.jpg" %}') no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        color: white; /* Default text color set to white for dark backgrounds */
    }

    /* Navbar */
    nav {
        width: 100%;
        background: rgba(39, 65, 83, 0.5); /* Slightly more opaque navbar */
        backdrop-filter: blur(10px);
        border-radius: 10px;
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav .logo {
        font-size: 22px;
        font-weight: bold;
        color: #a7ffeb;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    nav .logo img {
        width: 40px;
        height: auto;
        border-radius: 50%;
    }

    nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
    }

    nav ul li {
        margin: 0 15px;
    }

    nav ul li a {
        text-decoration: none;
        color: #eee; /* Lighter nav link text */
        font-size: 16px;
        transition: color 0.3s ease;
    }

    nav ul li a:hover {
        color: #a7ffeb;
    }

    /* Form Styling */
    .main {
        width: 80%;
        max-width: 900px;
        background: rgba(255, 255, 255, 0.15); /* Slightly more visible background */
        backdrop-filter: blur(15px);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); /* Slightly stronger shadow */
        padding: 40px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        margin-top: 80px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: white; /* Ensure text is white */
    }

    .main h2 {
        width: 100%;
        text-align: center;
        margin-bottom: 25px;
        font-size: 30px;
        color: white;
    }

    .form-group {
        width: 45%;
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
    }

    label {
        margin-bottom: 6px;
        font-weight: 500;
        color: #fff; /* White labels */
    }

    input, select {
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3); /* Slightly stronger border */
        background: rgba(255, 255, 255, 0.1); /* Slightly more visible input background */
        color: white;
        font-size: 16px;
        outline: none;
        backdrop-filter: blur(8px);
        box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.2);
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    input::placeholder {
        color: #ddd; /* Lighter placeholder text */
    }

    input:focus, select:focus {
        border-color: #a7ffeb;
        box-shadow: 0 0 10px rgba(167, 255, 235, 0.7); /* Brighter focus shadow */
    }

    select option {
        color: #333;
        background-color: #f8f8f8;
    }

    button {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background-color: #00b894;
        color: white;
        cursor: pointer;
        font-size: 18px;
        margin-top: 20px;
        transition: background-color 0.15s ease-in-out;
    }

    button:hover {
        background-color: #00ffc8;
        color: black;
    }

    @media (max-width: 768px) {
        .form-group {
            width: 100%;
        }
    }
</style>
</head>

<body>

    <nav>
        <div class="logo">
            <img src="{% static 'images/logogo.png' %}" alt="Logo" style="height: 40px; vertical-align: middle; margin-right: 10px;">
            Organ Donation
        </div>
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/login">Login</a></li>
        </ul>
    </nav>

    <div class="main">
        <h2 style="width: 100%; text-align: center; color: white; margin-bottom: 25px;">Registration Form</h2>
        <form action="{% url 'register' %}" method="POST" style="width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between;">
            {% csrf_token %}

            <div class="form-group">
                <label for="uname">User Name</label>
                <input type="text" name="uname" placeholder="Name" required>
            </div>
            <div class="form-group">
                <label for="age">Age</label>
                <input type="text" name="age" placeholder="Age" required>
            </div>
            <div class="form-group">
                <label for="bloodtype">Blood Type</label>
                <select id="bloodtype" name="bloodtype">
                    <option value="">Select</option>
                    <option value="A1">A+</option>
                    <option value="A2">A-</option>
                    <option value="B1">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB1">AB+</option>
                    <option value="AB2">AB-</option>
                    <option value="O1">O+</option>
                    <option value="O2">O-</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mobno">Mobile No</label>
                <input type="text" name="mobno" placeholder="Mobile Number" required>
            </div>
            <div class="form-group">
                <label for="pwd">Password</label>
                <input type="password" name="pwd" placeholder="Password" required>
            </div>
            <div class="form-group">
                <label for="locn">Location</label>
                <input type="text" name="locn" placeholder="Location (City, Country)" required>
            </div>
            <div class="form-group">
                <label for="hname">Hospital Name</label>
                <input type="text" name="hname" placeholder="Hospital Name" required>
            </div>
            <div class="form-group">
                <label for="organavail">Organ Available</label>
                <select id="organavail" name="organavail">
                    <option value="">Select</option>
                    <option value="Heart">Heart</option>
                    <option value="Liver">Liver</option>
                    <option value="Kidney">Kidney</option>
                    <option value="Lungs">Lungs</option>
                    <option value="Pancreas">Pancreas</option>
                </select>
            </div>
            <div class="form-group">
                <label for="chronicdisease">Chronic Disease</label>
                <select id="chronicdisease" name="chronicdisease">
                    <option value="">Select</option>
                    <option value="None">None</option>
                    <option value="Diabetes">Diabetes</option>
                    <option value="Hypertension">Hypertension</option>
                    <option value="Asthma">Asthma</option>
                    <option value="Heartd">Heart Disease</option>
                    <option value="Kidneyd">Kidney Disease</option>
                    <option value="Liverd">Liver Disease</option>
                </select>
            </div>
            <div class="form-group">
                <label for="infectious">Infectious Disease</label>
                <select id="infectious" name="infectious">
                    <option value="">Select</option>
                    <option value="Nonei">None</option>
                    <option value="HIV">HIV</option>
                    <option value="HepatitisB">Hepatitis B</option>
                    <option value="HepatitisC">Hepatitis C</option>
                    <option value="Tuberculosis">Tuberculosis</option>
                    <option value="Syphilis">Syphilis</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cancerhistory">Cancer History</label>
                <select id="cancerhistory" name="cancerhistory">
                    <option value="">Select</option>
                    <option value="Nonec">None</option>
                    <option value="breastcancer">Breast Cancer</option>
                    <option value="livercancer">Liver Cancer</option>
                    <option value="lungcancer">Lung Cancer</option>
                    <option value="coloncancer">Colon Cancer</option>
                    <option value="prostate">Prostate Cancer</option>
                    <option value="leukemia">Leukemia</option>
                </select>
            </div>
            <div class="form-group">
                <label for="medications">Current Medications</label>
                <select id="medications" name="medications">
                    <option value="">Select</option>
                    <option value="Nonem">None</option>
                    <option value="Immunosuppressants">Immunosuppressants</option>
                    <option value="BPmed">Blood Pressue Meds</option>
                    <option value="Diabeticmed">Diabetic Medicationr</option>
                    <option value="Painkillers">Pain Killers</option>
                    <option value="Antibiotic">Antibiotic</option>
                    <option value="Cholestrolmed">Cholestrol Med</option>
                </select>
            </div>

            <button type="submit" style="width: 100%; padding: 14px; border-radius: 12px; border: none; background-color: #00b894; color: white; cursor: pointer; font-size: 18px; margin-top: 20px; transition: background-color 0.15s ease-in-out;">Submit</button>
        </form>
    </div>

</body>
</html>
